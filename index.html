<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Rise example library</title>
<link rel="stylesheet" href="rise/tokens.css">
<link rel="stylesheet" href="rise/bundle.css">
<style>
/* The example binder. The frame, the spread, the pills, the fields and the table are the
 * platform's own components and bring their own styles. This file sets only what the
 * platform does not have yet: how a document reads inside a page.
 *
 * The reading rules are the ones the readability research graded: one column, text never
 * under 16 pixels, lines of 80 characters or fewer, left aligned, the point first, a label
 * above its value, and emphasis kept for warnings and defined words. Every part's address
 * hangs in one margin column, in the same place on all five pages. */
.loading { padding: var(--spacing-s7); }
.frame { display: flex; flex-direction: column; height: 100vh; height: 100svh; background: var(--background); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s4) var(--spacing-s6); padding: var(--spacing-s4) var(--spacing-s7); background: var(--primary-surface); }
.bar .mark { width: 6rem; min-width: 84px; height: auto; color: var(--foreground); }
.bar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s4) var(--spacing-s6); }
.bar-tools .switch { display: flex; align-items: center; gap: var(--spacing-s3); }
.bar-tools a { font-size: 0.875rem; text-underline-offset: 0.2em; }
.book { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-height: 0; }
.views { display: flex; gap: var(--spacing-s2); }
.search { position: relative; display: flex; align-items: center; gap: var(--spacing-s3); }
.search input { width: 26rem; max-width: 60vw; background: var(--card); }
.found { position: absolute; z-index: 30; top: calc(100% + var(--spacing-s2)); right: 0; width: min(44rem, 92vw); max-height: 70vh; overflow-y: auto; display: grid; gap: 1px; padding: var(--spacing-s3); border: 1px solid var(--tab); border-radius: var(--radius-lg); background: var(--card); font-size: max(0.9375rem, 15px); line-height: 1.4; }
.found .quiet { padding: var(--spacing-s3); }
.found-help { padding: var(--spacing-s3); max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s2); padding: var(--spacing-s2) var(--spacing-s3); }
.chips .quiet { padding: 0 var(--spacing-s2) 0 0; }
.only { display: inline-flex; align-items: center; gap: var(--spacing-s3); margin-left: auto; font-size: 0.875em; cursor: pointer; }
.found mark { background: var(--primary-soft); color: inherit; border-radius: var(--radius-xs); }
.hit.is-active { background: var(--tab-soft); }
.hit { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 0 var(--spacing-s4); padding: var(--spacing-s3); border: 0; border-radius: var(--radius-sm); background: none; font: inherit; color: var(--foreground); text-align: left; cursor: pointer; }
.hit:hover, .hit:focus-visible { background: var(--tab-soft); }
.hit-cite { grid-row: span 2; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tab-soft-foreground); overflow-wrap: anywhere; }
.hit-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-where { font-size: 0.875em; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.all-docs { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--spacing-s6); font-size: max(0.9375rem, 15px); }
.badges { display: inline-flex; flex-wrap: wrap; gap: var(--spacing-s2); }
.off-note { max-width: 60rem; padding: var(--spacing-s3) var(--spacing-s4); border-left: 3px solid var(--warning-solid); background: var(--warning-subtle); font-size: max(0.875rem, 14px); line-height: 1.5; }
.doc-list { display: grid; max-width: 48rem; list-style: none; font-size: max(1rem, 16px); line-height: 1.5; }
.doc-cell { display: grid; gap: var(--spacing-s2); min-width: 0; padding-block: var(--spacing-s5); border-top: 1px solid var(--border); }
.doc-cell:first-child { padding-top: 0; border-top: 0; }
.doc-cell > strong { font-size: 1.125em; }
.doc-cell .doc-open { justify-self: start; }
.subs { list-style: none; display: grid; gap: var(--spacing-s2); padding-left: 0; margin-top: var(--spacing-s2); }
.doc ol.subs { list-style: none; padding-left: 0; }
.subs > li { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); }
.stage-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s4) var(--spacing-s5); }
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3); }
.work { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-height: 0; width: 100%; padding: var(--spacing-s6) var(--spacing-s7) var(--spacing-s7); }
.binder-page { min-width: 0; }

/* ---- one page. The document is the page: it starts under the title, on the title's own left
 * edge, and scrolls with the page, so it has the whole height of the window and no box of its
 * own. The title stays put above it. */
[data-slot="document-page"].binder-page { gap: 0; padding: 0; overflow: hidden auto; }
.binder-page:last-child { border-radius: 0 var(--radius-2xl) var(--radius-2xl) 0; }  /* the last page meets the book's rounded corner, and rounds with it */
.binder-page > :first-child { position: sticky; top: 0; z-index: 2; padding: var(--spacing-s7) var(--spacing-s8) var(--spacing-s5); border-bottom: 1px solid var(--border); background: var(--card); }
.binder-page > :last-child { flex: none; justify-content: flex-start; padding: var(--spacing-s7) var(--spacing-s8) var(--spacing-s8); }
.binder-page.is-tight > :first-child { padding: var(--spacing-s6) var(--spacing-s5) var(--spacing-s4); }
.binder-page.is-tight > :last-child { padding: var(--spacing-s6) var(--spacing-s5); }
.pane-fit { display: flex; flex: 1; min-width: 0; width: 100%; container-type: inline-size; }
.pane { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-width: 0; }
.pane .pane-top { position: sticky; bottom: var(--spacing-s5); align-self: flex-end; background: var(--card); opacity: 0; pointer-events: none; transition: opacity var(--duration-normal) var(--ease-out); }
.pane .pane-top.is-shown { opacity: 1; pointer-events: auto; }
.pane-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3); }
.ix-row { display: grid; grid-template-columns: 3.75rem minmax(0, 1fr); gap: var(--spacing-s3); align-items: baseline; padding: var(--spacing-s2) var(--spacing-s3); border-radius: var(--radius-sm); font-size: max(0.875rem, 14px); line-height: 1.45; color: var(--foreground); text-decoration: none; }
.ix-row .ix { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tab-soft-foreground); }
.ix-row .ix-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ix-row.depth-0 { margin-top: var(--spacing-s4); font-size: max(1rem, 15px); font-weight: 600; grid-template-columns: 1.75rem minmax(0, 1fr); }
.ix-row.depth-0:first-child { margin-top: 0; }
.ix-row:hover { background: var(--muted); }
.ix-row.is-here { background: var(--tab-soft); }
.ix-group { padding: var(--spacing-s3) var(--spacing-s3) var(--spacing-s1); font-size: max(0.875rem, 14px); color: var(--muted-foreground); }
@container (max-width: 38rem) {
  .doc { --hang: 3.75rem; }
}
/* On a phone the book keeps its spines, so the page is narrow: the address sits above its
 * text instead of beside it, and the sheet gives its margin back to the words. */
@media (max-width: 47.99rem) {
  .bar, .work { padding-inline: var(--spacing-s4); }
  .binder-page > :first-child, .binder-page > :last-child { padding: var(--spacing-s4); }
  .doc { --hang: 0rem; gap: var(--spacing-s7); }
  .doc .item, .doc .part h3 { grid-template-columns: minmax(0, 1fr); }
  .doc .part h3 .ix { font-size: 0.75em; }
}

/* ---- a document inside a page */
.doc { --hang: 4.75rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--spacing-s7); max-width: calc(var(--hang) + 68ch); font-size: max(1rem, 16px); line-height: 1.6; color: var(--foreground); }
.doc.is-wide { max-width: none; }  /* a register is a table: it takes the width of the page, and its words keep their own measure */
.doc > * { min-width: 0; }
.doc p, .doc li, .doc dd { max-width: 68ch; }
.doc .ix { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tab-soft-foreground); }
.part { display: grid; gap: var(--spacing-s4); scroll-margin-top: var(--spacing-s5); }
.doc > .part { padding-top: var(--spacing-s6); border-top: 1px solid var(--border); }  /* open or closed, every part starts the same way */
.doc > .part:first-child { padding-top: 0; border-top: 0; }
.part h3 { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; font-size: 1.375em; line-height: 1.3; font-weight: 600; }
details.part > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--spacing-s2) var(--spacing-s5); cursor: pointer; list-style: none; }
details.part > summary::-webkit-details-marker { display: none; }
details.part > summary > h3 { flex: 1; }
details.part > summary .count { font-size: 0.875em; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
details.part > summary .count::after { content: "  Show"; font-weight: 600; color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em; }
details.part[open] > summary .count::after { content: "  Hide"; }
details.part:not([open]) { gap: 0; }
.plain { display: grid; gap: var(--spacing-s4); padding-left: var(--hang); }
.item { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; padding-block: var(--spacing-s5); border-top: 1px solid var(--border); scroll-margin-top: var(--spacing-s7); transition: background var(--duration-slow) var(--ease-out); }
.item-body { display: grid; gap: var(--spacing-s3); min-width: 0; border: 0; padding: 0; margin: 0; }
.doc ul, .doc ol { display: grid; gap: var(--spacing-s3); padding-left: var(--spacing-s6); }
.doc ul { list-style: disc; }
.doc ol { list-style: decimal; }
.stage { margin-top: var(--spacing-s5); padding-left: var(--hang); font-size: 1em; font-weight: 600; color: var(--muted-foreground); }
.who { color: var(--muted-foreground); }
.do { font-size: 1.125em; line-height: 1.5; }
.warn { padding: var(--spacing-s3) var(--spacing-s4); border-left: 3px solid var(--warning-solid); background: var(--warning-subtle); }
.lines { display: grid; gap: var(--spacing-s3); }
.lines > div { display: grid; gap: 0; }
.lines dt { font-size: 0.875em; color: var(--muted-foreground); }
.lines dd { margin: 0; overflow-wrap: anywhere; }
.trail, .quiet, .hint { font-size: 0.875em; color: var(--muted-foreground); }
.rel::after { content: ". "; }
.lk:not(:last-of-type)::after { content: ", "; }
.lk-more { font-style: normal; }

/* ---- two views of the same pages. A provider opens one page, with parts named in words and
 * only where a part leads. An auditor gets codes and both directions of every link. */
.is-provider .as-code, .is-auditor .as-name, .is-auditor .lk-more { display: none; }
.is-provider .rel.arriving, .is-provider .trail:not(.leads), .is-provider .lk:nth-of-type(n+4) { display: none; }
.is-provider .lk:nth-of-type(3):not(:last-of-type)::after { content: " "; }
/* The extras for judging the design itself stay out of both views until Design tools is ticked. */
.frame:not(.has-tools) details.part > summary .count { font-size: 0; }
.frame:not(.has-tools) details.part > summary .count::after { font-size: max(0.875rem, 14px); }
.frame:not(.has-tools) .off-note, .frame:not(.has-tools) .part > .quiet.plain { display: none; }

/* ---- the guide: one list beside the book, in the same place in both views */
.book-row { display: flex; flex: 1; gap: var(--spacing-s5); min-height: 0; position: relative; }
.book-row > [data-slot="document-spread"] { flex: 1; min-width: 0; }
.guide { display: flex; flex: none; flex-direction: column; width: 23rem; min-height: 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); font-size: max(0.9375rem, 15px); line-height: 1.4; }
.guide-head { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-s4) var(--spacing-s4) var(--spacing-s3) var(--spacing-s5); }
.guide-head h2 { font-size: 1.125em; font-weight: 600; }
.tally { display: flex; flex-wrap: wrap; gap: var(--spacing-s2); padding: 0 var(--spacing-s4) var(--spacing-s4); border-bottom: 1px solid var(--border); }
.guide-list { flex: 0 1 auto; min-height: 0; max-height: 64%; overflow-y: auto; padding: var(--spacing-s3); display: grid; gap: var(--spacing-s3); align-content: start; }
.guide-step { display: grid; gap: 1px; }
.guide-row { display: flex; align-items: center; gap: var(--spacing-s3); padding: var(--spacing-s3); border-radius: var(--radius-sm); color: var(--foreground); text-decoration: none; }
.guide-row:hover { background: var(--muted); }
.guide-row.is-step.is-open { background: var(--tab-subtle); }
.guide-row .spine { flex: none; display: inline-grid; place-items: center; width: 1.625rem; height: 1.625rem; border-radius: var(--radius-full); background: var(--tab-soft); color: var(--tab-soft-foreground); font-size: 0.8125em; font-weight: 600; }
.guide-row.is-open .spine { background: var(--tab-solid); color: var(--tab-solid-foreground); }
.guide-name { display: grid; gap: 0; flex: 1; min-width: 0; }
.guide-what { font-size: max(0.875em, 14px); font-weight: 400; color: var(--muted-foreground); }
.guide-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-s3); margin-top: var(--spacing-s1); }
.guide-row.is-doc { padding-left: calc(var(--spacing-s3) + 1.625rem + var(--spacing-s3)); }
.guide-row.is-current { background: var(--tab-soft); font-weight: 600; }
.guide-page { flex: 1 1 0; min-height: 8rem; overflow-y: auto; padding: var(--spacing-s4) var(--spacing-s3) var(--spacing-s4); border-top: 1px solid var(--border); }
.guide-over { padding: 0 var(--spacing-s3); font-size: 0.8125em; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); }
.guide-title { padding: 0 var(--spacing-s3) var(--spacing-s3); font-weight: 600; }
.guide-page > .guide-what { padding: 0 var(--spacing-s3); }
@media (max-width: 71.99rem) { .guide { position: absolute; z-index: 20; top: 0; right: 0; bottom: 0; width: min(23rem, 92vw); } }
.go { color: inherit; text-decoration: underline; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
.trail .go { color: var(--foreground); }
.term { font: inherit; font-weight: 600; color: inherit; padding: 0; border: 0; background: none; cursor: help; }
.term:hover { text-decoration: underline; text-underline-offset: 0.2em; }
.fill { background: var(--primary-subtle); }
.is-lit { background: var(--primary-surface); }
.doc .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
.doc table { border-collapse: collapse; width: 100%; font-size: 0.9375em; }
.doc th, .doc td { padding: var(--spacing-s3) var(--spacing-s4); text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.doc th { font-weight: 600; background: var(--tab-subtle); color: var(--tab-subtle-foreground); }

/* ---- the form */
.q-text { font-size: 1.125em; line-height: 1.45; font-weight: 600; }
.fields { display: grid; gap: var(--spacing-s5); margin-top: var(--spacing-s3); }
.field { display: grid; gap: var(--spacing-s2); justify-items: start; }
.field > input, .field > textarea { width: 100%; max-width: 32rem; font-size: 1rem; }
.field > input[type="date"], .field > input[type="datetime-local"], .field > input[type="number"] { max-width: 16rem; }
.choices { display: grid; gap: var(--spacing-s3); }
.choice { display: flex; align-items: center; gap: var(--spacing-s3); }
.choice label, .field > label { font-size: 1em; font-weight: 400; line-height: 1.4; }
.field > label { font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: var(--spacing-s4); padding-left: var(--hang); }
.saved { padding-left: var(--hang); }
.sign { display: grid; gap: var(--spacing-s3); }
.hidden-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- the register */
.sheets { display: flex; flex-wrap: wrap; gap: var(--spacing-s3); align-items: center; }
.reg-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
.doc table.reg { width: max-content; min-width: 100%; font-size: 0.9375em; }
.reg th { background: var(--tab-solid); color: var(--tab-solid-foreground); white-space: nowrap; padding: 0; border-bottom: 0; }
.reg th button { display: grid; gap: 0; width: 100%; padding: var(--spacing-s3) var(--spacing-s4); font: inherit; color: inherit; text-align: left; background: none; border: 0; cursor: pointer; }
.reg th button[aria-pressed="true"], .reg th button:hover { background: var(--tab-foreground); }
.reg th .letter { font-size: 0.8125em; font-weight: 400; }
.reg td { min-width: 9rem; max-width: 22rem; height: 2.75rem; border-right: 1px solid var(--border); }
.reg td:first-child, .reg th:first-child { position: sticky; left: 0; z-index: 1; }
.reg td:first-child { background: var(--card); font-weight: 600; max-width: 13rem; }
.reg .example td:first-child::after { content: " (example)"; font-weight: 400; color: var(--muted-foreground); }
.col-card { display: grid; gap: var(--spacing-s3); padding: var(--spacing-s5); border: 1px solid var(--border); border-radius: var(--radius-md); }
.col-card h4 { font-size: 1.125em; font-weight: 600; }

/* ---- the definition card */
.meaning { position: fixed; z-index: 30; left: var(--spacing-s5); right: var(--spacing-s5); bottom: calc(var(--spacing-s5) + env(safe-area-inset-bottom, 0px)); max-width: 40rem; margin-inline: auto; display: grid; gap: var(--spacing-s3); justify-items: start; padding: var(--spacing-s5) var(--spacing-s6); border: 1px solid var(--tab); border-radius: var(--radius-lg); background: var(--card); font-size: max(1rem, 16px); line-height: 1.5; }

/* ---- colour by page: off unless switched on, and never the only signal */
.colour-on [data-step="legislation"] { --page: var(--neutral-solid); }
.colour-on [data-step="policy"] { --page: var(--primary-solid); }
.colour-on [data-step="procedure"] { --page: var(--info-solid); }
.colour-on [data-step="forms"] { --page: var(--success-solid); }
.colour-on [data-step="registers"] { --page: var(--warning-solid); }
.colour-on .binder-page { box-shadow: inset 0 var(--spacing-s2) 0 var(--page); }
.colour-on .pill-dot { display: inline-block; }
.pill-dot { display: none; width: 0.625rem; height: 0.625rem; margin-right: var(--spacing-s3); border-radius: var(--radius-full); background: var(--page); }
.colour-on a.go[data-step]::before { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: 0.3em; border-radius: var(--radius-full); background: var(--page); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div id="root"><p class="loading">Loading the library.</p></div>
<script src="rise/react.js"></script>
<script src="rise/react-dom.js"></script>
<script src="rise/bundle.js"></script>
<script>
// The example library. Frame, spread, pills, trail, fields and tables are the platform's own
// components (window.Rise); this file arranges them the way the binder route does and
// supplies what the platform does not have yet: a form made from a form template, a register
// made from a register template, one index over the page, the binder and the whole library,
// search across every part, and links that open the part they point at, in this binder or
// in another.
(function () {
  "use strict";
  var R = window.Rise, h = React.createElement;
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var html = function (text) { return { dangerouslySetInnerHTML: { __html: text } }; };
  var cap = function (text) { return text.charAt(0).toUpperCase() + text.slice(1); };
  var loaded = {};

  // Each binder is its own file, read the first time it is opened.
  function read(name) {
    if (!loaded[name]) {
      loaded[name] = window.fetch("data/" + name + ".json").then(function (reply) {
        if (!reply.ok) throw new Error("data/" + name + ".json answered " + reply.status);
        return reply.json();
      });
      loaded[name].catch(function () { delete loaded[name]; });
    }
    return loaded[name];
  }

  function rem() { return parseFloat(window.getComputedStyle(document.documentElement).fontSize) || 16; }

  // Bring a part into view by scrolling only the boxes meant to scroll: the page's own sheet
  // and the register's own table. scrollIntoView would also drag the book, which is clipped.
  function reveal(target) {
    var how = calm ? "auto" : "smooth";
    for (var folded = target.closest("details"); folded; folded = folded.parentElement && folded.parentElement.closest("details")) folded.open = true;
    for (var box = target.parentElement; box && !box.classList.contains("frame"); box = box.parentElement) {
      var style = window.getComputedStyle(box), frame = box.getBoundingClientRect(), at = target.getBoundingClientRect();
      if (/auto|scroll/.test(style.overflowY) && box.scrollHeight > box.clientHeight) {
        var head = box.matches('[data-slot="document-page"]') ? box.firstElementChild.offsetHeight + 16 : 0;  // the title that stays put above the document
        var room = Math.max(0, (box.clientHeight - head - at.height) / 2);
        box.scrollTo({ top: box.scrollTop + at.top - frame.top - head - Math.min(room, box.clientHeight / 3), behavior: how });
      } else if (/auto|scroll/.test(style.overflowX) && box.scrollWidth > box.clientWidth) {
        var pinned = box.querySelector("tbody td:first-child");
        var lead = pinned && pinned !== target ? pinned.getBoundingClientRect().width : 0;
        box.scrollTo({ left: Math.max(0, box.scrollLeft + at.left - frame.left - lead), behavior: how });
      }
    }
  }

  // ---- answers and rows

  function exampleAnswers(form, kind) {
    var out = {};
    form.questions.forEach(function (q) {
      if (kind && q.skip.indexOf(kind) !== -1) return;
      q.controls.forEach(function (c, i) {
        var key = q.no + "." + i;

    var vd = React.useState({}), verdicts = vd[0], setVerdicts = vd[1];
    var auditor = mode === "auditor";
    var setVerdict = function (id, value) { setVerdicts(function (now) { var next = Object.assign({}, now); next[id] = value; return next; }); };

    React.useEffect(function () {
      read("library").then(function (found) {
        var asked = window.location.hash.slice(1);
        setLib(found);
        setKey(found.modules.some(function (m) { return m.standards.some(function (x) { return x.key === asked; }); }) ? asked : found.first);
      }, function (problem) { setFailed(String(problem.message || problem)); });
    }, []);

    React.useEffect(function () {
      if (!key) return;
      var wanted = key;
      setData(null);
      read(key).then(function (found) { if (wanted === key) { setData(found); try { window.history.replaceState(null, "", "#" + key); } catch (ignored) { /* a sandboxed frame may refuse; the page works without it */ } } },
        function (problem) { setFailed(String(problem.message || problem)); });
    }, [key]);

    // Open a binder, then land on a part of it. The book reads `arrive` once it is on screen.
    function openAt(binder, target) {
      setView("binder");
      setArrive(target ? Object.assign({ n: Date.now() }, target) : null);
      setKey(binder);
    }

    // An address the open binder has no page for: find the binder its document lives in.
    function leave(address) {
      var id = address.split(" ")[0], doc = lib.docs[id];
      if (doc && doc.home !== key) openAt(doc.home, { address: address });
    }

    if (failed) return h("p", { className: "loading" }, "The library could not be read: " + failed + ". Reload the page to try again.");
    if (!lib) return h("p", { className: "loading" }, "Loading the library.");
    return h("div", { className: "frame is-" + mode + (tools ? " has-tools" : "") + (colour && tools ? " colour-on" : "") },
      h("header", { className: "bar" },
        h(R.RiseWordmark, { className: "mark" }),
        h("div", { className: "bar-tools" },
          h("div", { className: "views" },
            h(R.Button, { variant: "tab", size: "sm", emphasis: !auditor ? "solid" : "soft", "aria-pressed": !auditor, onClick: function () { setMode("provider"); } }, "Provider"),
            h(R.Button, { variant: "tab", size: "sm", emphasis: auditor ? "solid" : "soft", "aria-pressed": auditor, onClick: function () { setMode("auditor"); } }, "Auditor")),
          h("div", { className: "views" },
            h(R.Button, { variant: "tab", size: "sm", emphasis: view === "binder" ? "solid" : "soft", "aria-pressed": view === "binder", onClick: function () { setView("binder"); } }, "Binder"),
            h(R.Button, { variant: "tab", size: "sm", emphasis: view === "table" ? "solid" : "soft", "aria-pressed": view === "table", onClick: function () { setView("table"); } }, "All documents")),
          h(Search, { here: key, steps: lib.steps, open: function (row) {
            var doc = row.a.split(" ").slice(0, row.a.charAt(0) === "s" ? 2 : 1).join(" ");
            var stay = data && (data.where[row.a] || data.where[doc]);
            openAt(stay ? key : row.k, row.p ? { part: row.p, step: lib.docs[doc] ? lib.docs[doc].step : "legislation", doc: doc } : { address: row.a });
          } }),
          h("div", { className: "switch" },
            h(R.Checkbox, { id: "tools", checked: tools, onCheckedChange: function (on) { setTools(!!on); } }),
            h(R.Label, { htmlFor: "tools" }, "Design tools")),
          tools ? h("div", { className: "switch" },
            h(R.Checkbox, { id: "colour", checked: colour, onCheckedChange: function (on) { setColour(!!on); } }),
            h(R.Label, { htmlFor: "colour" }, "Colour by page")) : null,
          tools ? h("a", { href: "anatomy.html" }, "Anatomy and open rulings") : null)),
      h("main", { className: "work" },
        view === "table" ? h(AllDocuments, { lib: lib, verdicts: verdicts, open: function (binder, id) { openAt(binder, { address: id }); } })
        : !data ? h("p", { className: "loading" }, "Opening the binder.")
        : h(Book, { key: data.key, data: data, lib: lib, mode: mode, tools: tools, verdicts: verdicts, setVerdict: setVerdict, arrive: arrive, leave: leave,
            openBinder: function (binder) { openAt(binder, null); } })));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(R.Router, null, h(App)));
})();
</script>
</body>
</html>
