<!doctype html>
<html lang="en" data-theme="light">
<head>

<style>
/* The example binder. The frame, the spread, the pills, the fields and the table are the
 * platform's own components and bring their own styles. This file sets only what the
 * platform does not have yet: how a document reads inside a page.
 *
 * The reading rules are the ones the readability research graded: one column, text never
 * under 16 pixels, lines of 80 characters or fewer, left aligned, the point first, a label
 * above its value, and emphasis kept for warnings and defined words. Every part's address
 * hangs in one margin column, in the same place on all five pages. */
.loading { padding: var(--spacing-s7); }
.frame { display: flex; flex-direction: column; height: 100vh; height: 100svh; background: var(--background); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s4) var(--spacing-s6); padding: var(--spacing-s4) var(--spacing-s7); background: var(--primary-surface); }
.bar .mark { width: 6rem; min-width: 84px; height: auto; color: var(--foreground); }
.bar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s4) var(--spacing-s6); }
.bar-tools .switch { display: flex; align-items: center; gap: var(--spacing-s3); }
.bar-tools a { font-size: 0.875rem; text-underline-offset: 0.2em; }
.book { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-height: 0; }
/* A quiet choice among a few: words in one bordered strip, the chosen one underlined. Settings are drawn
 * this way so that the five page tabs stay the only filled pills on the screen. */
.seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s1); padding: var(--spacing-s1); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); }
.seg-item { padding: var(--spacing-s2) var(--spacing-s3); border: 0; border-radius: var(--radius-sm); background: none; color: var(--muted-foreground); font: inherit; font-size: max(0.875rem, 14px); font-weight: 500; line-height: 1.3; cursor: pointer; text-decoration-thickness: 2px; text-underline-offset: 0.35em; }
.seg-item:hover { color: var(--foreground); }
.seg-item.is-on { color: var(--foreground); font-weight: 600; text-decoration-line: underline; }
.seg-item:disabled { opacity: 0.5; cursor: not-allowed; }
.view-as { display: flex; align-items: center; gap: var(--spacing-s3); font-size: max(0.875rem, 14px); }
.view-as select { padding: var(--spacing-s2) var(--spacing-s3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); color: var(--foreground); font: inherit; font-weight: 600; cursor: pointer; }
.search { position: relative; display: flex; align-items: center; gap: var(--spacing-s3); }
.search input { width: 26rem; max-width: 60vw; background: var(--card); }
.found { position: absolute; z-index: 30; top: calc(100% + var(--spacing-s2)); right: 0; width: min(44rem, 92vw); max-height: 70vh; overflow-y: auto; display: grid; gap: 1px; padding: var(--spacing-s3); border: 1px solid var(--tab); border-radius: var(--radius-lg); background: var(--card); font-size: max(0.9375rem, 15px); line-height: 1.4; }
.found .quiet { padding: var(--spacing-s3); }
.found-help { padding: var(--spacing-s3); max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s2); padding: var(--spacing-s2) var(--spacing-s3); }
.chips .quiet { padding: 0 var(--spacing-s2) 0 0; }
.only { display: inline-flex; align-items: center; gap: var(--spacing-s3); margin-left: auto; font-size: 0.875em; cursor: pointer; }
.found mark { background: var(--primary-soft); color: inherit; border-radius: var(--radius-xs); }
.hit.is-active { background: var(--tab-soft); }
.hit { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 0 var(--spacing-s4); padding: var(--spacing-s3); border: 0; border-radius: var(--radius-sm); background: none; font: inherit; color: var(--foreground); text-align: left; cursor: pointer; }
.hit:hover, .hit:focus-visible { background: var(--tab-soft); }
.hit-cite { grid-row: span 2; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tab-soft-foreground); overflow-wrap: anywhere; }
.hit-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-where { font-size: 0.875em; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.all-docs { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--spacing-s6); font-size: max(0.9375rem, 15px); }
.doc-link { padding: 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 0.2em; cursor: pointer; }
.all-docs [role="row"]:has(.doc-link) > [role="cell"] { cursor: pointer; }
.all-docs [role="row"]:has(.doc-link):hover > [role="cell"] { background: var(--tab-subtle); }
.all-docs [role="row"]:has(.doc-link):hover .doc-link, .doc-link:focus-visible { text-decoration-color: currentColor; }
.badges { display: inline-flex; flex-wrap: wrap; gap: var(--spacing-s2); }
.off-note { max-width: 60rem; padding: var(--spacing-s3) var(--spacing-s4); border-left: 3px solid var(--warning-solid); background: var(--warning-subtle); font-size: max(0.875rem, 14px); line-height: 1.5; }
.doc-list { display: grid; max-width: 48rem; list-style: none; font-size: max(1rem, 16px); line-height: 1.5; }
.doc-cell { display: grid; gap: var(--spacing-s2); min-width: 0; padding-block: var(--spacing-s5); border-top: 1px solid var(--border); }
.doc-cell:first-child { padding-top: 0; border-top: 0; }
.doc-cell > strong { font-size: 1.125em; }
.doc-cell .doc-open { justify-self: start; }
.subs { list-style: none; display: grid; gap: var(--spacing-s2); padding-left: 0; margin-top: var(--spacing-s2); }
.doc ol.subs { list-style: none; padding-left: 0; }
.subs > li { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); }
.stage-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s4) var(--spacing-s5); }
.stage-left { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3) var(--spacing-s5); }
/* The bar in two rows: where you are and search above; the five pages and how you read them below. */
.stage-what { padding-top: var(--spacing-s3); border-top: 1px solid var(--border); }
.stage-search { flex: 1 1 22rem; display: flex; justify-content: flex-end; min-width: 0; }
.stage-search .search { width: min(100%, 40rem); }
.stage-search .search input { flex: 1; width: auto; max-width: none; }
.step-no { display: inline-grid; place-items: center; min-width: 1.375rem; height: 1.375rem; margin-right: var(--spacing-s2); border-radius: var(--radius-full); background: var(--card); color: var(--foreground); font-size: 0.8125em; font-weight: 700; }
/* The auditor's review of the standard, under the bar: progress, what is open, the next document to check. */
.review-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s3) var(--spacing-s5); padding: var(--spacing-s3) var(--spacing-s5); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
.review-said { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--spacing-s2) var(--spacing-s5); }
.review-said span { color: var(--muted-foreground); }
.review-acts { display: flex; flex-wrap: wrap; gap: var(--spacing-s3); }
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3); }
.work { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-height: 0; width: 100%; padding: var(--spacing-s6) var(--spacing-s7) var(--spacing-s7); }
.binder-page { min-width: 0; }

/* ---- one page. The document is the page: it starts under the title, on the title's own left
 * edge, and scrolls with the page, so it has the whole height of the window and no box of its
 * own. The title stays put above it. */
[data-slot="document-page"].binder-page { gap: 0; padding: 0; overflow: hidden auto; }
.binder-page:last-child { border-radius: 0 var(--radius-2xl) var(--radius-2xl) 0; }  /* the last page meets the book's rounded corner, and rounds with it */
.binder-page > :first-child { position: sticky; top: 0; z-index: 2; padding: var(--spacing-s7) var(--spacing-s8) var(--spacing-s5); border-bottom: 1px solid var(--border); background: var(--card); }
.binder-page > :last-child { flex: none; justify-content: flex-start; padding: var(--spacing-s7) var(--spacing-s8) var(--spacing-s8); }
.binder-page.is-tight > :first-child { padding: var(--spacing-s6) var(--spacing-s5) var(--spacing-s4); }
.binder-page.is-tight > :last-child { padding: var(--spacing-s6) var(--spacing-s5); }
.pane-fit { display: flex; flex: 1; min-width: 0; width: 100%; container-type: inline-size; }
.pane { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-width: 0; }
.pane .pane-top { position: sticky; bottom: var(--spacing-s5); align-self: flex-end; background: var(--card); opacity: 0; pointer-events: none; transition: opacity var(--duration-normal) var(--ease-out); }
.pane .pane-top.is-shown { opacity: 1; pointer-events: auto; }
.pane-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3); }
.ix-row { display: grid; grid-template-columns: 3.75rem minmax(0, 1fr); gap: var(--spacing-s3); align-items: baseline; padding: var(--spacing-s2) var(--spacing-s3); border-radius: var(--radius-sm); font-size: max(0.875rem, 14px); line-height: 1.45; color: var(--foreground); text-decoration: none; }
.ix-row .ix { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tab-soft-foreground); }
.ix-row .ix-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ix-row.depth-0 { margin-top: var(--spacing-s4); font-size: max(1rem, 15px); font-weight: 600; grid-template-columns: 1.75rem minmax(0, 1fr); }
.ix-row.depth-0:first-child { margin-top: 0; }
.ix-row:hover { background: var(--muted); }
.ix-row.is-here { background: var(--tab-soft); }
.ix-group { padding: var(--spacing-s3) var(--spacing-s3) var(--spacing-s1); font-size: max(0.875rem, 14px); color: var(--muted-foreground); }
@container (max-width: 38rem) {
  .doc { --hang: 3.75rem; }
}
/* On a phone the book keeps its spines, so the page is narrow: the address sits above its
 * text instead of beside it, and the sheet gives its margin back to the words. */
@media (max-width: 47.99rem) {
  .bar, .work { padding-inline: var(--spacing-s4); }
  .binder-page > :first-child, .binder-page > :last-child { padding: var(--spacing-s4); }
  .doc { --hang: 0rem; gap: var(--spacing-s7); }
  .doc .item, .doc .part h3 { grid-template-columns: minmax(0, 1fr); }
  .doc .part h3 .ix { font-size: 0.75em; }
}

/* ---- a document inside a page */
.doc { --hang: 4.75rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--spacing-s7); max-width: calc(var(--hang) + 68ch); font-size: max(1rem, 16px); line-height: 1.6; color: var(--foreground); }
.doc.is-wide { max-width: none; }  /* a register is a table: it takes the width of the page, and its words keep their own measure */
.doc > * { min-width: 0; }
.doc p, .doc li, .doc dd { max-width: 68ch; }
.doc .ix { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tab-soft-foreground); }
.part { display: grid; gap: var(--spacing-s4); scroll-margin-top: var(--spacing-s5); }
.doc > .part { padding-top: var(--spacing-s6); border-top: 1px solid var(--border); }  /* open or closed, every part starts the same way */
.doc > .part:first-child { padding-top: 0; border-top: 0; }
.part h3 { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; font-size: 1.375em; line-height: 1.3; font-weight: 600; }
details.part > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--spacing-s2) var(--spacing-s5); cursor: pointer; list-style: none; }
details.part > summary::-webkit-details-marker { display: none; }
details.part > summary > h3 { flex: 1; }
details.part > summary .count { font-size: 0.875em; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
details.part > summary .count::after { content: "  Show"; font-weight: 600; color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em; }
details.part[open] > summary .count::after { content: "  Hide"; }
details.part:not([open]) { gap: 0; }
.plain { display: grid; gap: var(--spacing-s4); padding-left: var(--hang); }
.item { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; padding-block: var(--spacing-s5); border-top: 1px solid var(--border); scroll-margin-top: var(--spacing-s7); transition: background var(--duration-slow) var(--ease-out); }
.item-body { display: grid; gap: var(--spacing-s3); min-width: 0; border: 0; padding: 0; margin: 0; }
.doc ul, .doc ol { display: grid; gap: var(--spacing-s3); padding-left: var(--spacing-s6); }
.doc ul { list-style: disc; }
.doc ol { list-style: decimal; }
.stage { margin-top: var(--spacing-s5); padding-left: var(--hang); font-size: 1em; font-weight: 600; color: var(--muted-foreground); }
.who { color: var(--muted-foreground); }
.do { font-size: 1.125em; line-height: 1.5; }
.warn { padding: var(--spacing-s3) var(--spacing-s4); border-left: 3px solid var(--warning-solid); background: var(--warning-subtle); }
.lines { display: grid; gap: var(--spacing-s3); }
.lines > div { display: grid; gap: 0; }
.lines dt { font-size: 0.875em; color: var(--muted-foreground); }
.lines dd { margin: 0; overflow-wrap: anywhere; }
.trail, .quiet, .hint { font-size: 0.875em; color: var(--muted-foreground); }
/* A part's links: one row of tags, where it comes from and where it leads, the way the bounce
 * prototype draws them (Jesse, 19 Oct). Each tag opens its place beside this page. */
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s2) var(--spacing-s5); }
.rel { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s2); }
.trail .go { display: inline-flex; align-items: center; gap: var(--spacing-s2); padding: var(--spacing-s1) var(--spacing-s3); border: 1px solid var(--primary-solid); border-radius: var(--radius-full); background: var(--card); color: var(--primary-foreground); font-weight: 600; line-height: 1.4; text-decoration: none; }
.trail .go:hover { background: var(--primary-surface); }
.trail .go:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.lk-more { padding: var(--spacing-s1) var(--spacing-s2); border: 0; border-radius: var(--radius-sm); background: none; color: var(--foreground); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; }
.lk-more:hover { background: var(--muted); }
.lk-more:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.lk-more .when-open, .rel.is-open .lk-more .for-provider, .rel.is-open .lk-more .for-auditor { display: none; }
.rel.is-open .lk-more .when-open { display: inline; }

/* ---- two views of the same pages. A provider opens one page, with parts named in words and the
 * first three links of each kind. An auditor gets codes and every link. */
.is-provider .as-code, .is-auditor .as-name { display: none; }
.is-provider .lk-more .for-auditor, .is-auditor .lk-more .for-provider { display: none; }
.is-auditor .lk-more:not(:has(.for-auditor)) { display: none; }
.is-provider .rel:not(.is-open) .lk:nth-of-type(n+4), .is-auditor .rel:not(.is-open) .lk:nth-of-type(n+7) { display: none; }
/* The extras for judging the design itself stay out of both views until Design tools is ticked. */
.frame:not(.has-tools) details.part > summary .count { font-size: 0; }
.frame:not(.has-tools) details.part > summary .count::after { font-size: max(0.875rem, 14px); }
.frame:not(.has-tools) .off-note, .frame:not(.has-tools) .part > .quiet.plain { display: none; }

/* ---- the guide: one list beside the book, in the same place in both views */
.book-row { display: flex; flex: 1; gap: var(--spacing-s5); min-height: 0; position: relative; }
.book-row > [data-slot="document-spread"] { flex: 1; min-width: 0; }
.guide { display: flex; flex: none; flex-direction: column; width: 23rem; min-height: 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); font-size: max(0.9375rem, 15px); line-height: 1.4; }
.guide-head { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-s4) var(--spacing-s4) var(--spacing-s3) var(--spacing-s5); }
.guide-head h2 { font-size: 1.125em; font-weight: 600; }
.guide-acts, .page-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--spacing-s3) var(--spacing-s5); }
/* The guide at half size: the binder's list on the left, the page index, the comments or the selected statement beside it.
 * At full size it takes the place of the book and is a plain board: the documents with their verdicts, and every comment. */
.guide.is-wide { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); }
.guide.is-half { width: 50%; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); grid-template-areas: "head head" "walk page" "tally page" "list page"; }
.guide.is-full { flex: 1; width: auto; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); grid-template-areas: "head head" "walk board" "tally board" "list board"; }
.book-row.is-full > [data-slot="document-spread"] { display: none; }
.guide.is-wide .guide-head { grid-area: head; }
.guide.is-wide .walk { grid-area: walk; }
.guide.is-wide .tally { grid-area: tally; }
.guide.is-wide .guide-list, .guide.is-wide.has-trace .guide-list { grid-area: list; max-height: none; }
.guide.is-wide .guide-page { grid-area: page; border-top: 0; border-left: 1px solid var(--border); }
.guide-board { grid-area: board; min-height: 0; overflow-y: auto; padding: var(--spacing-s4) var(--spacing-s5); border-left: 1px solid var(--border); }
.guide-board > .guide-over, .guide-board > .guide-title, .guide-board > .guide-what { padding-inline: 0; }
.board-note { display: grid; gap: var(--spacing-s3); padding-block: var(--spacing-s5); border-top: 1px solid var(--border); }
.board-note > .trace-said { padding: 0; }
.board-note > .doc-link { justify-self: start; }
.walk { display: flex; gap: var(--spacing-s3); padding: 0 var(--spacing-s4) var(--spacing-s4); }
.walk .walk-next { flex: 1; min-width: 0; justify-content: space-between; }
.walk-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally { padding: 0 var(--spacing-s4) var(--spacing-s4); border-bottom: 1px solid var(--border); }
.guide-list { flex: 0 1 auto; min-height: 0; max-height: 50%; overflow-y: auto; padding: var(--spacing-s3); display: grid; gap: var(--spacing-s3); align-content: start; }
.guide-step { display: grid; gap: 1px; }
.guide-row { display: flex; align-items: center; gap: var(--spacing-s3); padding: var(--spacing-s3); border-radius: var(--radius-sm); color: var(--foreground); text-decoration: none; }
.guide-row:hover { background: var(--muted); }
.guide-row.is-step.is-open { background: var(--tab-subtle); }
.guide-row .spine { flex: none; display: inline-grid; place-items: center; width: 1.625rem; height: 1.625rem; border-radius: var(--radius-full); background: var(--tab-soft); color: var(--tab-soft-foreground); font-size: 0.8125em; font-weight: 600; }
.guide-row.is-open .spine { background: var(--tab-solid); color: var(--tab-solid-foreground); }
.guide-name { display: grid; gap: 0; flex: 1; min-width: 0; }
.guide-what { font-size: max(0.875em, 14px); font-weight: 400; color: var(--muted-foreground); }
.guide-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-s3); margin-top: var(--spacing-s1); }
.guide-row.is-doc { padding-left: calc(var(--spacing-s3) + 1.625rem + var(--spacing-s3)); }
.guide-row.is-current { background: var(--tab-soft); font-weight: 600; }
.guide-page { display: flex; flex-direction: column; flex: 1 1 0; min-height: 10rem; border-top: 1px solid var(--border); }
.guide-page-head { flex: none; display: grid; gap: var(--spacing-s2); padding: var(--spacing-s4) var(--spacing-s3) var(--spacing-s2); }
.guide-page-head > .seg { justify-self: start; margin-left: var(--spacing-s3); }
.guide-page-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--spacing-s3) var(--spacing-s4); }
.guide-over { padding: 0 var(--spacing-s3); font-size: 0.8125em; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); }
.guide-title { padding: 0 var(--spacing-s3) var(--spacing-s3); font-weight: 600; }
.guide-page-body > .guide-what { padding: 0 var(--spacing-s3); }
/* ---- one row of a register, read as a record: the same fields, listed down the page */
.reg tr.is-row { cursor: pointer; }
.reg tr.is-row:hover td, .reg tr.is-open td { background: var(--tab-subtle); }
.record { display: grid; gap: var(--spacing-s5); padding: var(--spacing-s5) var(--spacing-s6); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.record-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s3); }
.record-head h4 { font-size: 1.125em; font-weight: 600; }
.record-fields { columns: 24rem; column-gap: var(--spacing-s8); }
.record-fields > div { break-inside: avoid; padding-block: var(--spacing-s3); border-top: 1px solid var(--border); }
.record-fields dt { font-size: max(0.875em, 14px); color: var(--muted-foreground); }
.record-fields dd { max-width: none; }
/* ---- the trace: one statement, and every place it is carried on the other pages */
.doc .item { cursor: pointer; }
.doc .item:hover { background: var(--muted); }
/* The marks sit just left of the statement, in the page's margin, so the bar never covers its number ("C4"). */
.doc .item.is-picked { background: var(--tab-soft); box-shadow: -0.5rem 0 0 var(--tab-soft), -0.75rem 0 0 var(--tab-solid); }

      return text.split(find).map(function (piece, i) { return i % 2 ? h("mark", { key: i }, piece) : piece; });
    };

    var change = function (value) { setTyped(value); setActive(0); setLimit(12); setFocused(true); load(); };
    var choose = function (row) { setTyped(""); setFocused(false); if (box.current) box.current.blur(); props.open(row); };
    var keys = function (event) {
      if (event.key === "ArrowDown") { event.preventDefault(); setActive(Math.min(active + 1, shown.length - 1)); }
      else if (event.key === "ArrowUp") { event.preventDefault(); setActive(Math.max(active - 1, 0)); }
      else if (event.key === "Escape") { setTyped(""); event.target.blur(); }
    };

    // Keep the result the arrow keys are on inside the list, without moving the page.
    React.useEffect(function () {
      var list = panel.current, on = list && list.querySelector(".hit.is-active");
      if (!on) return;
      var c = list.getBoundingClientRect(), x = on.getBoundingClientRect();
      if (x.top < c.top) list.scrollTop += x.top - c.top - 8;
      else if (x.bottom > c.bottom) list.scrollTop += x.bottom - c.bottom + 8;
    }, [active]);

    var chip = function (key, label, count) {
      return h(R.Button, { key: key, type: "button", variant: "tab", size: "sm", emphasis: page === key ? "solid" : "soft", "aria-pressed": page === key,
        onClick: function () { setPage(key); setActive(0); setLimit(12); } }, label + " " + count.toLocaleString());
    };
    var body = null;
    if (focused && !words.length) {
      body = h("div", { className: "found", ref: panel },
        h("p", { className: "found-help" }, "Type words, a document's name, or an address. Search reads every word of every part, in every binder."),
        h("div", { className: "chips" }, h("span", { className: "quiet" }, "Try"), TRY.map(function (example) {
          return h(R.Button, { key: example, type: "button", variant: "tab", size: "sm", emphasis: "soft", onClick: function () { change(example); if (box.current) box.current.focus(); } }, example);
        })),
        h("p", { className: "quiet" }, "Press / from anywhere to search. The arrow keys move through results and Enter opens one."));
    } else if (focused) {
      body = h("div", { className: "found", ref: panel, role: "listbox", "aria-label": "Search results" },
        !rows ? h("p", { className: "quiet" }, "Reading the library.") : h(React.Fragment, null,
          h("div", { className: "chips" },
            chip("all", "All", total),
            props.steps.filter(function (step) { return counts[step.key]; }).map(function (step) { return chip(step.key, step.label, counts[step.key]); }),
            h("label", { className: "only" }, h(R.Checkbox, { id: "only", checked: only, onCheckedChange: function (on) { setOnly(!!on); setActive(0); } }), h("span", null, "This binder only"))),
          !shown.length ? h("p", { className: "quiet" }, "Nothing matches that" + (only ? " in this binder." : page !== "all" ? " on this kind of page." : "."))
          : shown.map(function (row, i) {
              return h("button", { type: "button", role: "option", "aria-selected": i === active, key: row.k + row.c + i, className: "hit" + (i === active ? " is-active" : ""),
                onMouseEnter: function () { setActive(i); }, onClick: function () { choose(row); } },
                h("span", { className: "hit-cite" }, marked(row.c)), h("span", { className: "hit-text" }, marked(line(row))), h("span", { className: "hit-where" }, row.w));
            }),
          matched.length > shown.length ? h("div", { className: "chips" },
            h("span", { className: "quiet" }, "Showing " + shown.length + " of " + matched.length.toLocaleString()),
            h(R.Button, { type: "button", variant: "neutral", emphasis: "outline", size: "sm", onClick: function () { setLimit(limit + 24); } }, "Show more")) : null));
    }
    return h("form", { className: "search", role: "search", onSubmit: function (e) { e.preventDefault(); if (shown[active]) choose(shown[active]); },
      onBlur: function (e) { if (!e.currentTarget.contains(e.relatedTarget)) setFocused(false); } },
      h(R.Label, { htmlFor: "search" }, h(R.Icon, { name: "search" }), "Search every document"),
      h(R.Input, { id: "search", ref: box, type: "search", value: typed, autoComplete: "off", "aria-keyshortcuts": "/", title: "Press / to search from anywhere",
        onFocus: function () { setFocused(true); load(); }, onChange: function (e) { change(e.target.value); }, onKeyDown: keys }),
      body);
  }

  // ---- the frame: which binder, which view

  // A platform screen that frames this page has already decided who it is guiding: there the
  // sign in sets the view and nobody chooses. It says so with ?view=provider or ?view=auditor,
  // and the choice then leaves the bar. Any other address keeps the choice on the page.
  var asked = new URLSearchParams(window.location.search).get("view");
  var given = asked === "provider" || asked === "auditor" ? asked : null;

  function App() {
    var l = React.useState(null), lib = l[0], setLib = l[1];
    var k = React.useState(null), key = k[0], setKey = k[1];
    var d = React.useState(null), data = d[0], setData = d[1];
    var e = React.useState(null), failed = e[0], setFailed = e[1];
    var v = React.useState("binder"), view = v[0], setView = v[1];
    var a = React.useState(null), arrive = a[0], setArrive = a[1];
    var c = React.useState(false), colour = c[0], setColour = c[1];
    var m = React.useState(given || "provider"), mode = m[0], setMode = m[1];  // who the page is guiding
    var ly = React.useState("one"), layout = ly[0], setLayout = ly[1];  // the way of working chosen: one page at a time, or pages side by side
    var t = React.useState(false), tools = t[0], setTools = t[1];   // the extras for judging the design itself
    var vd = React.useState({}), verdicts = vd[0], setVerdicts = vd[1];
    var nt = React.useState({}), notes = nt[0], setNotes = nt[1];  // address -> threads, in the platform's own comment shape
    var auditor = mode === "auditor";
    var noteActs = {
      add: function (address, body, parent, anchor) {
        var made = { id: "note-" + Date.now(), author: auditor ? "Auditor" : "Provider", createdAt: new Date().toISOString(), body: body,
          visibility: "all_parties", anchored: true, resolved: false, replies: [], anchor: anchor };
        setNotes(function (now) {
          var next = Object.assign({}, now), threads = (now[address] || []).slice();
          if (parent) threads = threads.map(function (t) { return t.id === parent ? Object.assign({}, t, { replies: t.replies.concat(made) }) : t; });
          else threads.push(made);
          next[address] = threads;
          return next;
        });
      },
      resolve: function (address, id) {
        setNotes(function (now) {
          var next = Object.assign({}, now);
          next[address] = (now[address] || []).map(function (t) {
            return t.id === id ? Object.assign({}, t, { resolved: !t.resolved, status: t.resolved ? undefined : "Resolved", statusTone: "success" }) : t;
          });
          return next;
        });
      },
      remove: function (address, id) {
        setNotes(function (now) {
          var next = Object.assign({}, now);
          next[address] = (now[address] || []).filter(function (t) { return t.id !== id; })
            .map(function (t) { return Object.assign({}, t, { replies: t.replies.filter(function (r) { return r.id !== id; }) }); });
          return next;
        });
      }
    };
    var setVerdict = function (id, value) { setVerdicts(function (now) { var next = Object.assign({}, now); next[id] = value; return next; }); };

    React.useEffect(function () {
      read("library").then(function (found) {
        var asked = window.location.hash.slice(1);
        setLib(found);
        setKey(found.modules.some(function (m) { return m.standards.some(function (x) { return x.key === asked; }); }) ? asked : found.first);
      }, function (problem) { setFailed(String(problem.message || problem)); });
    }, []);

    React.useEffect(function () {
      if (!key) return;
      var wanted = key;
      setData(null);
      read(key).then(function (found) { if (wanted === key) { setData(found); try { window.history.replaceState(null, "", "#" + key); } catch (ignored) { /* a sandboxed frame may refuse; the page works without it */ } } },
        function (problem) { setFailed(String(problem.message || problem)); });
    }, [key]);

    // Open a binder, then land on a part of it. The book reads `arrive` once it is on screen.
    function openAt(binder, target) {
      setView("binder");
      setArrive(target ? Object.assign({ n: Date.now() }, target) : null);
      setKey(binder);
    }

    // An address the open binder has no page for: find the binder its document lives in.
    function leave(address) {
      var id = address.split(" ")[0], doc = lib.docs[id];
      if (doc && doc.home !== key) openAt(doc.home, { address: address });
    }

    if (failed) return h("p", { className: "loading" }, "The library could not be read: " + failed + ". Reload the page to try again.");
    if (!lib) return h("p", { className: "loading" }, "Loading the library.");
    var shown = h(Seg, { key: "shown", label: "What is shown", value: view, options: [["binder", "This standard"], ["table", "All documents"]], onChange: setView });
    var search = h(Search, { key: "search", here: key, steps: lib.steps, open: function (row) {
      var doc = row.a.split(" ").slice(0, row.a.charAt(0) === "s" ? 2 : 1).join(" ");
      var stay = data && (data.where[row.a] || data.where[doc]);
      openAt(stay ? key : row.k, row.p ? { part: row.p, step: lib.docs[doc] ? lib.docs[doc].step : "legislation", doc: doc } : { address: row.a });
    } });
    // Framed by a platform screen, the page brings no bar of its own: the platform's header is the
    // only one (Jesse, 15 Oct: the bar read as "a second menu"). The two controls a reader needs,
    // what is shown and search, join the book's own row; the wordmark and the design tools stay
    // on the page's own address, where they belong.
    var framedControls = given ? [shown, search] : null;
    return h("div", { className: "frame is-" + mode + (given ? " is-framed" : "") + (tools ? " has-tools" : "") + (colour && tools ? " colour-on" : "") },
      given ? null : h("header", { className: "bar" },
        h(R.RiseWordmark, { className: "mark" }),
        h("div", { className: "bar-tools" },
          h("label", { className: "view-as" }, h("span", null, "View as"),
            h("select", { value: mode, onChange: function (event) { setMode(event.target.value); } },
              h("option", { value: "provider" }, "Provider"), h("option", { value: "auditor" }, "Auditor"))),
          shown,
          search,
          h("div", { className: "switch" },
            h(R.Checkbox, { id: "tools", checked: tools, onCheckedChange: function (on) { setTools(!!on); } }),
            h(R.Label, { htmlFor: "tools" }, "Design tools")),
          tools ? h("div", { className: "switch" },
            h(R.Checkbox, { id: "colour", checked: colour, onCheckedChange: function (on) { setColour(!!on); } }),
            h(R.Label, { htmlFor: "colour" }, "Colour by page")) : null,
          tools ? h("a", { href: "anatomy.html" }, "Anatomy and open rulings") : null)),
      h("main", { className: "work" },
        view === "table" ? h(React.Fragment, null,
          framedControls ? h("div", { className: "stage-row" }, h("div", { className: "pills" }, framedControls)) : null,
          h(AllDocuments, { lib: lib, verdicts: verdicts, open: function (binder, id) { openAt(binder, { address: id }); } }))
        : !data ? h("p", { className: "loading" }, "Opening the binder.")
        : h(Book, { key: data.key, data: data, lib: lib, mode: mode, layout: layout, setLayout: setLayout, tools: tools, verdicts: verdicts, setVerdict: setVerdict,
            controls: framedControls,
            notes: notes, noteActs: noteActs,
            arrive: arrive, leave: leave,
            openBinder: function (binder, address) { openAt(binder, address ? { address: address } : null); } })));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(R.Router, null, h(App)));
})();
