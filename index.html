<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Rise example library</title>
<link rel="stylesheet" href="rise/tokens.css">
<link rel="stylesheet" href="rise/bundle.css">
<style>
/* The example binder. The frame, the spread, the pills, the fields and the table are the
 * platform's own components and bring their own styles. This file sets only what the
 * platform does not have yet: how a document reads inside a page.
 *
 * The reading rules are the ones the readability research graded: one column, text never
 * under 16 pixels, lines of 80 characters or fewer, left aligned, the point first, a label
 * above its value, and emphasis kept for warnings and defined words. Every part's address
 * hangs in one margin column, in the same place on all five pages. */
.loading { padding: var(--spacing-s7); }
.frame { display: flex; flex-direction: column; height: 100vh; height: 100svh; background: var(--background); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s4) var(--spacing-s6); padding: var(--spacing-s4) var(--spacing-s7); background: var(--primary-surface); }
.bar .mark { width: 6rem; min-width: 84px; height: auto; color: var(--foreground); }
.bar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s4) var(--spacing-s6); }
.bar-tools .switch { display: flex; align-items: center; gap: var(--spacing-s3); }
.bar-tools a { font-size: 0.875rem; text-underline-offset: 0.2em; }
.book { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-height: 0; }
.views { display: flex; gap: var(--spacing-s2); }
.search { position: relative; display: flex; align-items: center; gap: var(--spacing-s3); }
.search input { width: 22rem; max-width: 60vw; background: var(--card); }
.found { position: absolute; z-index: 30; top: calc(100% + var(--spacing-s2)); right: 0; width: min(36rem, 92vw); max-height: 70vh; overflow-y: auto; display: grid; gap: 1px; padding: var(--spacing-s3); border: 1px solid var(--tab); border-radius: var(--radius-lg); background: var(--card); font-size: max(0.9375rem, 15px); line-height: 1.4; }
.found .quiet { padding: var(--spacing-s3); }
.hit { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 0 var(--spacing-s4); padding: var(--spacing-s3); border: 0; border-radius: var(--radius-sm); background: none; font: inherit; color: var(--foreground); text-align: left; cursor: pointer; }
.hit:hover, .hit:focus-visible { background: var(--tab-soft); }
.hit-cite { grid-row: span 2; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tab-soft-foreground); overflow-wrap: anywhere; }
.hit-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-where { font-size: 0.875em; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.all-docs { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--spacing-s6); font-size: max(0.9375rem, 15px); }
.step-table { font-size: max(0.9375rem, 15px); overflow-x: auto; }
.scopes { display: flex; flex-wrap: wrap; gap: var(--spacing-s2); margin-bottom: var(--spacing-s4); }
.subs { list-style: none; display: grid; gap: var(--spacing-s2); padding-left: 0; margin-top: var(--spacing-s2); }
.doc ol.subs { list-style: none; padding-left: 0; }
.subs > li { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); }
.stage-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-s4) var(--spacing-s5); }
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3); }
.work { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-height: 0; width: 100%; padding: var(--spacing-s6) var(--spacing-s7) var(--spacing-s7); }
.binder-page { min-width: 0; }
.binder-page.is-tight { padding: var(--spacing-s6) var(--spacing-s5); gap: var(--spacing-s5); }

/* ---- one page: its controls, its sheet, and the index beside it when there is room.
 * The widths are the platform's own: a 48rem sheet, an s5 gap, a 24rem side panel. */
.pane-fit { display: flex; flex: 1; justify-content: center; min-width: 0; min-height: 0; width: 100%; container-type: inline-size; }
.pane { display: flex; flex: 1; flex-direction: column; gap: var(--spacing-s5); min-width: 0; min-height: 0; max-width: var(--container-sheet); }
.pane.has-side { max-width: calc(var(--container-sheet) + var(--spacing-s5) + var(--container-side-panel)); }
.pane-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-s3); }
.pane-row { display: flex; flex: 1; gap: var(--spacing-s5); min-height: 0; }
.pane-sheet { min-width: 0; }
.side { display: flex; flex: none; flex-direction: column; width: var(--container-side-panel); min-height: 0; }
.side-tabs { display: flex; align-items: flex-end; }
.side-tab { position: relative; display: flex; align-items: center; gap: var(--spacing-s2); margin-bottom: -1px; padding: var(--spacing-s1) var(--spacing-s2) var(--spacing-s1) var(--spacing-s4); border: 1px solid var(--border); border-bottom: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; background: var(--card); font-size: 0.875rem; font-weight: 500; }
.side-card { flex: 1; min-height: 0; overflow-y: auto; padding: var(--spacing-s4); border: 1px solid var(--border); border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg); background: var(--card); }
.ix-row { display: grid; grid-template-columns: 3.75rem minmax(0, 1fr); gap: var(--spacing-s3); align-items: baseline; padding: var(--spacing-s2) var(--spacing-s3); border-radius: var(--radius-sm); font-size: max(0.875rem, 14px); line-height: 1.45; color: var(--foreground); text-decoration: none; }
.ix-row .ix { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tab-soft-foreground); }
.ix-row .ix-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ix-row.depth-0 { margin-top: var(--spacing-s4); font-size: max(1rem, 15px); font-weight: 600; grid-template-columns: 1.75rem minmax(0, 1fr); }
.ix-row.depth-0:first-child { margin-top: 0; }
.ix-row:hover { background: var(--muted); }
.ix-row.is-here { background: var(--tab-soft); }
.ix-group { padding: var(--spacing-s3) var(--spacing-s3) var(--spacing-s1); font-size: max(0.8125rem, 13px); color: var(--muted-foreground); }
@container (max-width: 38rem) {
  .pane-sheet > div { padding: var(--spacing-s5); }
  .doc { --hang: 3.75rem; }
}
/* On a phone the book keeps its spines, so the page is narrow: the address sits above its
 * text instead of beside it, and the sheet gives its margin back to the words. */
@media (max-width: 47.99rem) {
  .bar, .work { padding-inline: var(--spacing-s4); }
  .binder-page { padding: var(--spacing-s4); gap: var(--spacing-s4); }
  .binder-page [class*="max-w-sheet"] { padding: var(--spacing-s4); }
  .doc { --hang: 0rem; gap: var(--spacing-s7); }
  .doc .item, .doc .part > h3 { grid-template-columns: minmax(0, 1fr); }
  .doc .part > h3 .ix { font-size: 0.75em; }
}

/* ---- a document inside a page */
.doc { --hang: 4.75rem; display: grid; gap: var(--spacing-s7); max-width: 42rem; font-size: max(1rem, 16px); line-height: 1.6; color: var(--foreground); }
.doc > * { min-width: 0; }
.doc p, .doc li, .doc dd { max-width: 68ch; }
.doc .ix { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tab-soft-foreground); }
.part { display: grid; gap: var(--spacing-s4); scroll-margin-top: var(--spacing-s5); }
.part > h3 { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; font-size: 1.375em; line-height: 1.3; font-weight: 600; }
details.part > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--spacing-s2) var(--spacing-s5); cursor: pointer; list-style: none; padding-block: var(--spacing-s3); border-top: 1px solid var(--border); }
details.part > summary::-webkit-details-marker { display: none; }
details.part > summary > h3 { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; flex: 1; font-size: 1.125em; line-height: 1.3; font-weight: 600; }
details.part > summary .count { font-size: 0.875em; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
details.part > summary .count::after { content: "  Show"; font-weight: 600; color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em; }
details.part[open] > summary .count::after { content: "  Hide"; }
details.part:not([open]) { gap: 0; }
.plain { display: grid; gap: var(--spacing-s4); padding-left: var(--hang); }
.item { display: grid; grid-template-columns: var(--hang) minmax(0, 1fr); align-items: baseline; padding-block: var(--spacing-s5); border-top: 1px solid var(--border); scroll-margin-top: var(--spacing-s7); transition: background var(--duration-slow) var(--ease-out); }
.item-body { display: grid; gap: var(--spacing-s3); min-width: 0; border: 0; padding: 0; margin: 0; }
.doc ul, .doc ol { display: grid; gap: var(--spacing-s3); padding-left: var(--spacing-s6); }
.doc ul { list-style: disc; }
.doc ol { list-style: decimal; }
.stage { margin-top: var(--spacing-s5); padding-left: var(--hang); font-size: 1em; font-weight: 600; color: var(--muted-foreground); }
.who { color: var(--muted-foreground); }
.do { font-size: 1.125em; line-height: 1.5; }
.warn { padding: var(--spacing-s3) var(--spacing-s4); border-left: 3px solid var(--warning-solid); background: var(--warning-subtle); }
.lines { display: grid; gap: var(--spacing-s3); }
.lines > div { display: grid; gap: 0; }
.lines dt { font-size: 0.875em; color: var(--muted-foreground); }
.lines dd { margin: 0; overflow-wrap: anywhere; }
.trail, .quiet, .hint { font-size: 0.875em; color: var(--muted-foreground); }
.go { color: inherit; text-decoration: underline; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
.trail .go { color: var(--foreground); }
.term { font: inherit; font-weight: 600; color: inherit; padding: 0; border: 0; background: none; cursor: help; }
.term:hover { text-decoration: underline; text-underline-offset: 0.2em; }
.fill { background: var(--primary-subtle); }
.is-lit { background: var(--primary-surface); }
.doc .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
.doc table { border-collapse: collapse; width: 100%; font-size: 0.9375em; }
.doc th, .doc td { padding: var(--spacing-s3) var(--spacing-s4); text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.doc th { font-weight: 600; background: var(--tab-subtle); color: var(--tab-subtle-foreground); }

/* ---- the form */
.q-text { font-size: 1.125em; line-height: 1.45; font-weight: 600; }
.fields { display: grid; gap: var(--spacing-s5); margin-top: var(--spacing-s3); }
.field { display: grid; gap: var(--spacing-s2); justify-items: start; }
.field > input, .field > textarea { width: 100%; max-width: 32rem; font-size: 1rem; }
.field > input[type="date"], .field > input[type="datetime-local"], .field > input[type="number"] { max-width: 16rem; }
.choices { display: grid; gap: var(--spacing-s3); }
.choice { display: flex; align-items: center; gap: var(--spacing-s3); }
.choice label, .field > label { font-size: 1em; font-weight: 400; line-height: 1.4; }
.field > label { font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: var(--spacing-s4); padding-left: var(--hang); }
.saved { padding-left: var(--hang); }
.sign { display: grid; gap: var(--spacing-s3); }
.hidden-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- the register */
.sheets { display: flex; flex-wrap: wrap; gap: var(--spacing-s3); align-items: center; }
.reg-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
.doc table.reg { width: max-content; min-width: 100%; font-size: 0.9375em; }
.reg th { background: var(--tab-solid); color: var(--tab-solid-foreground); white-space: nowrap; padding: 0; border-bottom: 0; }
.reg th button { display: grid; gap: 0; width: 100%; padding: var(--spacing-s3) var(--spacing-s4); font: inherit; color: inherit; text-align: left; background: none; border: 0; cursor: pointer; }
.reg th button[aria-pressed="true"], .reg th button:hover { background: var(--tab-foreground); }
.reg th .letter { font-size: 0.8125em; font-weight: 400; }
.reg td { min-width: 9rem; max-width: 22rem; height: 2.75rem; border-right: 1px solid var(--border); }
.reg td:first-child, .reg th:first-child { position: sticky; left: 0; z-index: 1; }
.reg td:first-child { background: var(--card); font-weight: 600; max-width: 13rem; }
.reg .example td:first-child::after { content: " (example)"; font-weight: 400; color: var(--muted-foreground); }
.col-card { display: grid; gap: var(--spacing-s3); padding: var(--spacing-s5); border: 1px solid var(--border); border-radius: var(--radius-md); }
.col-card h4 { font-size: 1.125em; font-weight: 600; }

/* ---- the definition card */
.meaning { position: fixed; z-index: 30; left: var(--spacing-s5); right: var(--spacing-s5); bottom: calc(var(--spacing-s5) + env(safe-area-inset-bottom, 0px)); max-width: 40rem; margin-inline: auto; display: grid; gap: var(--spacing-s3); justify-items: start; padding: var(--spacing-s5) var(--spacing-s6); border: 1px solid var(--tab); border-radius: var(--radius-lg); background: var(--card); font-size: max(1rem, 16px); line-height: 1.5; }

/* ---- colour by page: off unless switched on, and never the only signal */
.colour-on [data-step="legislation"] { --page: var(--neutral-solid); }
.colour-on [data-step="policy"] { --page: var(--primary-solid); }
.colour-on [data-step="procedure"] { --page: var(--info-solid); }
.colour-on [data-step="forms"] { --page: var(--success-solid); }
.colour-on [data-step="registers"] { --page: var(--warning-solid); }
.colour-on .binder-page { box-shadow: inset 0 var(--spacing-s2) 0 var(--page); }
.colour-on .pill-dot { display: inline-block; }
.pill-dot { display: none; width: 0.625rem; height: 0.625rem; margin-right: var(--spacing-s3); border-radius: var(--radius-full); background: var(--page); }
.colour-on a.go[data-step]::before { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: 0.3em; border-radius: var(--radius-full); background: var(--page); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<body>
<div id="root"><p class="loading">Loading the library.</p></div>
<script src="rise/react.js"></script>
<script src="rise/react-dom.js"></script>
<script src="rise/bundle.js"></script>
<script>
// The example library. Frame, spread, pills, trail, fields and tables are the platform's own
// components (window.Rise); this file arranges them the way the binder route does and
// supplies what the platform does not have yet: a form made from a form template, a register
// made from a register template, one index over the page, the binder and the whole library,
// search across every part, and links that open the part they point at, in this binder or
// in another.
(function () {
  "use strict";
  var R = window.Rise, h = React.createElement;
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var html = function (text) { return { dangerouslySetInnerHTML: { __html: text } }; };
  var cap = function (text) { return text.charAt(0).toUpperCase() + text.slice(1); };
  var loaded = {};

  // Each binder is its own file, read the first time it is opened.
  function read(name) {
    if (!loaded[name]) {
      loaded[name] = window.fetch("data/" + name + ".json").then(function (reply) {
        if (!reply.ok) throw new Error("data/" + name + ".json answered " + reply.status);
        return reply.json();
      });
      loaded[name].catch(function () { delete loaded[name]; });
    }
    return loaded[name];
  }

  function rem() { return parseFloat(window.getComputedStyle(document.documentElement).fontSize) || 16; }

  // Bring a part into view by scrolling only the boxes meant to scroll: the page's own sheet
  // and the register's own table. scrollIntoView would also drag the book, which is clipped.
  function reveal(target) {
    var how = calm ? "auto" : "smooth";
    for (var folded = target.closest("details"); folded; folded = folded.parentElement && folded.parentElement.closest("details")) folded.open = true;
    for (var box = target.parentElement; box && !box.classList.contains("frame"); box = box.parentElement) {
      var style = window.getComputedStyle(box), frame = box.getBoundingClientRect(), at = target.getBoundingClientRect();
      if (/auto|scroll/.test(style.overflowY) && box.scrollHeight > box.clientHeight) {
        var room = Math.max(0, (box.clientHeight - at.height) / 2);
        box.scrollTo({ top: box.scrollTop + at.top - frame.top - Math.min(room, box.clientHeight / 3), behavior: how });
      } else if (/auto|scroll/.test(style.overflowX) && box.scrollWidth > box.clientWidth) {
        var pinned = box.querySelector("tbody td:first-child");
        var lead = pinned && pinned !== target ? pinned.getBoundingClientRect().width : 0;
        box.scrollTo({ left: Math.max(0, box.scrollLeft + at.left - frame.left - lead), behavior: how });
      }
    }
  }

  // ---- answers and rows

  function exampleAnswers(form, kind) {
    var out = {};
    form.questions.forEach(function (q) {
      if (kind && q.skip.indexOf(kind) !== -1) return;
      q.controls.forEach(function (c, i) {
        var key = q.no + "." + i;
        if (kind && q.no === "1" && i === 0) out[key] = kind;
        else if (c.type === "one") out[key] = c.options[0];
        else if (c.type === "any") out[key] = [c.options[0]];
        else if (c.type === "date") out[key] = "2026-10-12";
        else if (c.type === "datetime") out[key] = "2026-10-12T10:30";
        else if (c.type === "number") out[key] = "3";
        else out[key] = "Example answer";
      });
    });
    return out;
  }

  function said(value) {
    if (Array.isArray(value)) return value.join(", ");
    return value == null ? "" : String(value).replace("T", " ");
  }

  // A register row is made from a form's answers by the register template's own "Filled from"
  // column: each column takes the answers of the questions it names on that form.
  function rowFrom(formDoc, register, answers, kind, example) {
    var cells = {};
    register.columns.forEach(function (column) {
      var parts = [];
      (column.questions[formDoc.id] || []).forEach(function (no) {
        var q = formDoc.form.questions.filter(function (x) { return x.no === no; })[0];
        if (!q) return;
        q.controls.forEach(function (c, i) { var value = said(answers[no + "." + i]); if (value) parts.push(value); });
      });
      cells[column.letter] = parts.join("; ");
    });
    return { example: !!example, kind: kind || "", cells: cells };
  }

  function feeds(formDoc, registerDoc) {
    return registerDoc.register.columns.some(function (c) { return (c.questions[formDoc.id] || []).length; });
  }

  // ---- parts of the two pages the browser draws

  // One numbered part of a page. A reference part starts closed and says how long it is.
  function Part(props) {
    var p = props.part;
    if (!p) return null;
    var title = h("h3", null, h("span", { className: "ix" }, p.n), p.name);
    if (p.fold) return h("details", { className: "part", id: p.id }, h("summary", null, title, h("span", { className: "count" }, p.words.toLocaleString() + " words")), props.children);
    return h("section", { className: "part", id: p.id }, title, props.children);
  }

  function partNamed(parts, name) { return parts.filter(function (p) { return p.name === name; })[0]; }

  function Control(props) {
    var c = props.control, id = props.id, value = props.value, set = props.set, name = props.name;
    if (c.type === "one") {
      return h("div", { className: "field" }, c.label ? h("p", null, h("strong", null, c.label)) : null,
        h(R.RadioGroup, { value: value || "", onValueChange: set, "aria-label": c.label || name, className: "choices" },
          c.options.map(function (option, i) {
            return h("div", { className: "choice", key: option },
              h(R.RadioGroupItem, { value: option, id: id + "-" + i }), h(R.Label, { htmlFor: id + "-" + i }, cap(option)));
          })));
    }
    if (c.type === "any") {
      var chosen = value || [];
      return h("div", { className: "field" }, c.label ? h("p", null, h("strong", null, c.label)) : null,
        h("div", { className: "choices", role: "group", "aria-label": c.label || name },
          c.options.map(function (option, i) {
            return h("div", { className: "choice", key: option },
              h(R.Checkbox, { id: id + "-" + i, checked: chosen.indexOf(option) !== -1, onCheckedChange: function (on) {
                set(on ? chosen.concat(option) : chosen.filter(function (x) { return x !== option; }));
              } }),
              h(R.Label, { htmlFor: id + "-" + i }, cap(option)));
          })));
    }
    var common = { id: id, value: value || "", onChange: function (e) { set(e.target.value); }, "aria-label": c.label ? undefined : name };
    var input = c.type === "long" ? h(R.Textarea, Object.assign({ rows: 4 }, common))
      : h(R.Input, Object.assign({ type: c.type === "date" ? "date" : c.type === "datetime" ? "datetime-local" : c.type === "number" ? "number" : "text" }, common));
    return h("div", { className: "field" }, c.label ? h(R.Label, { htmlFor: id }, c.label) : null, input);
  }

  function FormPage(props) {
    var F = props.doc.form, kind = props.kind, answers = props.answers;
    var shown = F.questions.filter(function (q) { return !kind || q.skip.indexOf(kind) === -1; });
    var hidden = F.questions.length - shown.length;
    var set = function (key, value) {
      var next = Object.assign({}, answers); next[key] = value; props.setAnswers(next);
      if (kind && key === "1.0") props.setKind(value);
    };
    return h("div", { className: "doc" },
      h(Part, { part: partNamed(F.parts, "What this is for") }, h("div", Object.assign({ className: "plain" }, html(F.intro)))),
      h(Part, { part: partNamed(F.parts, "Privacy") }, h("div", Object.assign({ className: "plain" }, html(F.privacy)))),
      h(Part, { part: partNamed(F.parts, "Sections and questions") },
        hidden ? h("p", { className: "plain quiet" }, hidden + " questions that do not apply to a " + kind + " record are hidden. Question 1 changes the kind of record.") : null,
        F.sections.map(function (section) {
          var mine = shown.filter(function (q) { return q.section === section; });
          if (!mine.length) return null;

        basis: open.length > 1 ? 100 / open.length : null, className: "binder-page" + (open.length > 2 ? " is-tight" : ""),
        "data-page": step, "data-step": step },
        h(Pane, { step: step, docId: doc ? doc.id : "", entries: entriesFor(doc), binderRows: binderRows, libraryRows: libraryRows, more: more,
          pick: function (e) { if (e.go) go(e.go, step); else setLit({ id: e.id, n: Date.now() }); } }, body(step, doc)));
    }

    // Every step keeps its spine, in order; an open step has its page straight after its spine.
    var kids = [];
    STEPS.forEach(function (step, i) {
      var isOpen = open.indexOf(step) !== -1;
      kids.push(h(R.PageSpine, { key: "spine-" + step, number: i + 1, active: isOpen,
        onClick: function () { if (isOpen) setOpen([step]); else show([step], null); } }));
      if (isOpen) kids.push(page(step));
    });

    // A pill opens its page beside the others, or closes it. One page always stays open.
    var pills = lib.steps.map(function (x) {
      var isOpen = open.indexOf(x.key) !== -1;
      return h(R.Button, { key: x.key, variant: "tab", size: "md", emphasis: isOpen ? "solid" : "soft", className: "font-normal",
        "data-step": x.key, "aria-pressed": isOpen,
        onClick: function () {
          if (!isOpen) show([x.key], null);
          else if (open.length > 1) setOpen(open.filter(function (y) { return y !== x.key; }));
        } }, h("span", { className: "pill-dot" }), x.label);
    });

    // The trail is the platform's: module, then standard, each with its siblings on a chevron.
    var module = lib.modules.filter(function (m) { return m.standards.some(function (x) { return x.key === data.key; }); })[0];
    var trail = h(R.Breadcrumb, { className: "gap-s6" },
      h(R.BreadcrumbItem, { index: data.crumbs[0].index || undefined, menu: h(R.DropdownMenuContent, { align: "start" },
        lib.modules.map(function (m) { return h(R.DropdownMenuItem, { key: m.name, onSelect: function () { props.openBinder(m.standards[0].key); } }, (m.no ? m.no + ". " : "") + m.name); })) }, data.crumbs[0].label),
      h(R.BreadcrumbItem, { index: data.crumbs[1].index, current: true, menu: h(R.DropdownMenuContent, { align: "start", className: "max-h-80 overflow-y-auto" },
        module.standards.map(function (x) { return h(R.DropdownMenuItem, { key: x.key, onSelect: function () { props.openBinder(x.key); } }, x.index + "  " + x.heading); })) }, data.crumbs[1].label));

    return h("div", { className: "book", onClick: onClick },
      h("div", { className: "stage-row" }, trail, h("div", { className: "pills" }, pills)),
      h(R.DocumentSpread, { className: "relative" }, kids),
      word ? h("aside", { className: "meaning", role: "status" },
        h("p", null, h("strong", null, word.term + ": "), word.meaning),
        h("p", { className: "quiet" }, "Defined once, in " + word.source + ", Words we use. Every page in the binder uses that one wording."),
        h(R.Button, { variant: "neutral", emphasis: "outline", size: "sm", onClick: function () { setWord(null); } }, "Close")) : null);
  }

  // ---- every document, as a table

  function AllDocuments(props) {
    var lib = props.lib, of = {}, step = {};
    lib.modules.forEach(function (m) { m.standards.forEach(function (x) { of[x.key] = { module: m, standard: x }; }); });
    lib.steps.forEach(function (x) { step[x.key] = x.label; });
    var groups = lib.modules.map(function (m) {
      var mine = Object.keys(lib.docs).filter(function (id) { return of[lib.docs[id].home].module === m; });
      return { id: m.name, label: (m.no ? "Module " + m.no + ": " : "") + m.name + " (" + mine.length + " documents)", rows: mine.map(function (id) {
        var doc = lib.docs[id], home = of[doc.home].standard;
        return { id: id, cells: { doc: id, title: doc.title, page: step[doc.step], standard: home.index + "  " + home.heading,
          also: doc.binders.length > 1 ? "and " + (doc.binders.length - 1) + " more" : "",
          words: doc.words == null ? "" : doc.words.toLocaleString(),
          status: h(R.Badge, { tone: doc.problem ? "warning" : "neutral", size: "sm" }, doc.status),
          open: doc.problem ? h("span", { className: "quiet" }, doc.problem)
            : h(R.Button, { variant: "neutral", emphasis: "link", size: "sm", onClick: function () { props.open(doc.home, id); } }, "View document") } };
      }) };
    });
    return h("div", { className: "all-docs" }, h(R.DataTable, { caption: "Every document in the library",
      columns: [{ key: "doc", header: "Document" }, { key: "title", header: "Title" }, { key: "page", header: "Page" }, { key: "standard", header: "Standard" },
                { key: "also", header: "Also in" }, { key: "words", header: "Words", align: "right" }, { key: "status", header: "Status" }, { key: "open", header: "" }],
      groups: groups }));
  }

  // ---- search: an address, a document, or words, across every binder

  function Search(props) {
    var q = React.useState(""), typed = q[0], setTyped = q[1];
    var r = React.useState(null), rows = r[0], setRows = r[1];
    var f = React.useState(false), focused = f[0], setFocused = f[1];
    // The first use reads the list and keeps, for each row, everything it can be found by.
    var load = function () {
      if (!rows) read("search").then(function (list) {
        list.forEach(function (row) { row.h = (row.c + " " + row.t + " " + row.w + " " + (row.x || "")).toLowerCase(); });
        setRows(list);
      }, function () { setRows([]); });
    };
    // The line shown for a hit: its opening words, or the words around the match when the match is further in.
    var line = function (row) {
      var opening = row.t.toLowerCase(), text = row.x || "";
      for (var i = 0; i < words.length; i++) {
        if (opening.indexOf(words[i]) !== -1) continue;
        var at = text.toLowerCase().indexOf(words[i]);
        if (at > 40) return "... " + text.slice(at - 40, at + 70).replace(/^\S*\s/, "") + " ...";
      }
      return row.t;
    };
    var words = typed.trim().toLowerCase().replace(/^question (\d)/, "q$1").replace(/^column /, "col ").split(/\s+/).filter(Boolean);
    var found = [];
    if (rows && words.length) {
      var scored = [];
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i], cite = row.c.toLowerCase();
        if (!words.every(function (word) { return row.h.indexOf(word) !== -1; })) continue;
        var whole = words.join(" ");
        var score = (cite === whole ? 100 : 0) + (cite.slice(-whole.length - 1) === " " + whole ? 60 : 0) + (cite.indexOf(whole) !== -1 ? 30 : 0)
          + (row.t.toLowerCase().indexOf(whole) !== -1 ? 10 : 0) + (row.h.indexOf(whole) !== -1 ? 6 : 0) + (row.k === props.here ? 5 : 0);
        scored.push([score, i]);
      }
      scored.sort(function (x, y) { return y[0] - x[0] || x[1] - y[1]; });
      found = scored.slice(0, 12).map(function (x) { return rows[x[1]]; });
    }
    var choose = function (row) { setTyped(""); setFocused(false); props.open(row); };
    return h("form", { className: "search", role: "search", onSubmit: function (e) { e.preventDefault(); if (found[0]) choose(found[0]); },
      onBlur: function (e) { if (!e.currentTarget.contains(e.relatedTarget)) setFocused(false); } },
      h(R.Label, { htmlFor: "search" }, "Search"),
      h(R.Input, { id: "search", type: "text", value: typed, autoComplete: "off", placeholder: "Words, a document, or an address such as Q8",
        onFocus: function () { setFocused(true); load(); }, onChange: function (e) { setTyped(e.target.value); setFocused(true); load(); },
        onKeyDown: function (e) { if (e.key === "Escape") { setTyped(""); e.target.blur(); } } }),
      focused && words.length ? h("div", { className: "found", role: "listbox", "aria-label": "Search results" },
        !rows ? h("p", { className: "quiet" }, "Reading the library.")
        : !found.length ? h("p", { className: "quiet" }, "Nothing in the library matches that.")
        : found.map(function (row, i) {
            return h("button", { type: "button", role: "option", key: i, className: "hit", onClick: function () { choose(row); } },
              h("span", { className: "hit-cite" }, row.c), h("span", { className: "hit-text" }, line(row)), h("span", { className: "hit-where" }, row.w));
          })) : null);
  }

  // ---- the frame: which binder, which view

  function App() {
    var l = React.useState(null), lib = l[0], setLib = l[1];
    var k = React.useState(null), key = k[0], setKey = k[1];
    var d = React.useState(null), data = d[0], setData = d[1];
    var e = React.useState(null), failed = e[0], setFailed = e[1];
    var v = React.useState("binder"), view = v[0], setView = v[1];
    var a = React.useState(null), arrive = a[0], setArrive = a[1];
    var c = React.useState(false), colour = c[0], setColour = c[1];

    React.useEffect(function () {
      read("library").then(function (found) {
        var asked = window.location.hash.slice(1);
        setLib(found);
        setKey(found.modules.some(function (m) { return m.standards.some(function (x) { return x.key === asked; }); }) ? asked : found.first);
      }, function (problem) { setFailed(String(problem.message || problem)); });
    }, []);

    React.useEffect(function () {
      if (!key) return;
      var wanted = key;
      setData(null);
      read(key).then(function (found) { if (wanted === key) { setData(found); try { window.history.replaceState(null, "", "#" + key); } catch (ignored) { /* a sandboxed frame may refuse; the page works without it */ } } },
        function (problem) { setFailed(String(problem.message || problem)); });
    }, [key]);

    // Open a binder, then land on a part of it. The book reads `arrive` once it is on screen.
    function openAt(binder, target) {
      setView("binder");
      setArrive(target ? Object.assign({ n: Date.now() }, target) : null);
      setKey(binder);
    }

    // An address the open binder has no page for: find the binder its document lives in.
    function leave(address) {
      var id = address.split(" ")[0], doc = lib.docs[id];
      if (doc && doc.home !== key) openAt(doc.home, { address: address });
    }

    if (failed) return h("p", { className: "loading" }, "The library could not be read: " + failed + ". Reload the page to try again.");
    if (!lib) return h("p", { className: "loading" }, "Loading the library.");
    return h("div", { className: "frame" + (colour ? " colour-on" : "") },
      h("header", { className: "bar" },
        h(R.RiseWordmark, { className: "mark" }),
        h("div", { className: "bar-tools" },
          h("div", { className: "views" },
            h(R.Button, { variant: "tab", size: "sm", emphasis: view === "binder" ? "solid" : "soft", "aria-pressed": view === "binder", onClick: function () { setView("binder"); } }, "Binder"),
            h(R.Button, { variant: "tab", size: "sm", emphasis: view === "table" ? "solid" : "soft", "aria-pressed": view === "table", onClick: function () { setView("table"); } }, "All documents")),
          h(Search, { here: key, open: function (row) {
            var doc = row.a.split(" ").slice(0, row.a.charAt(0) === "s" ? 2 : 1).join(" ");
            var stay = data && (data.where[row.a] || data.where[doc]);
            openAt(stay ? key : row.k, row.p ? { part: row.p, step: lib.docs[doc] ? lib.docs[doc].step : "legislation", doc: doc } : { address: row.a });
          } }),
          h("div", { className: "switch" },
            h(R.Checkbox, { id: "colour", checked: colour, onCheckedChange: function (on) { setColour(!!on); } }),
            h(R.Label, { htmlFor: "colour" }, "Colour by page")),
          h("a", { href: "anatomy.html" }, "Anatomy and open rulings"))),
      h("main", { className: "work" },
        view === "table" ? h(AllDocuments, { lib: lib, open: function (binder, id) { openAt(binder, { address: id }); } })
        : !data ? h("p", { className: "loading" }, "Opening the binder.")
        : h(Book, { key: data.key, data: data, lib: lib, arrive: arrive, leave: leave, openBinder: function (binder) { openAt(binder, null); } })));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(R.Router, null, h(App)));
})();
</script>
</body>
</html>
